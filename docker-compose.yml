# ==============================================================================
# Apiapia — deployment orchestration.
# ==============================================================================

# Shared by all three services. Anchored so the rotation policy is stated once
# instead of three times drifting apart.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: apiapia_postgres
    restart: unless-stopped
    # The postgres image reads exactly these three variables, so they must be
    # passed explicitly. The backend learns the same credentials from `.env`
    # (via env_file below), which is why they are not repeated here.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-apiapia}
    ports:
      # Bind to 127.0.0.1 by default so the database is never exposed to the public internet
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - apiapia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-apiapia}"]
      interval: 2s
      timeout: 2s
      retries: 10
      # initdb on an empty volume is not instant; without this the probe counts
      # those seconds as failures and marks a healthy database unhealthy.
      start_period: 10s
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apiapia_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - apiapia_mem0_data:/app/data/mem0
      - apiapia_media:/app/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: apiapia_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      # Server-side only: where this container reaches the backend. Never
      # exposed to the browser.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000/api}
    logging: *default-logging

volumes:
  apiapia_postgres_data:
    driver: local
  apiapia_mem0_data:
    driver: local
  apiapia_media:
    driver: local