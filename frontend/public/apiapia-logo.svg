<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 200" width="760" height="200">
  <defs>
    <!-- Title Gradient -->
    <linearGradient id="logo-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="tech-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="badge-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Left Icon Mascot Badge (160x160 centered at x=20, y=20) -->
  <g transform="translate(20, 20)">
    <image width="160" height="160" filter="url(#badge-shadow)" href="/apiapia-avatar-circle.png" />
  </g>

  <!-- Typography Right Section -->
  <g transform="translate(210, 0)">
    <!-- Brand Title: Apiapia -->
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#logo-text-grad)">Apiapia</text>
    
    <!-- AI Tag Badge -->
    <g transform="translate(262, 54)">
      <rect width="60" height="28" rx="8" fill="url(#tech-badge)" />
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">AI</text>
    </g>

    <!-- Subtitle: Personal Assistant & Memory -->
    <text x="2" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="0.2" fill="#64748b">Personal Assistant with Long-Term Memory</text>

    <!-- Chinese Slogan tag -->
    <text x="2" y="172" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="500" fill="#94a3b8">一只有长期记忆的智能猫咪助理</text>
  </g>
</svg>
