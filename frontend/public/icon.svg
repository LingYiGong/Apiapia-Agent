<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b74a4" />
      <stop offset="50%" stop-color="#2d3368" />
      <stop offset="100%" stop-color="#171846" />
    </linearGradient>
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Squircle Base with Apple curve -->
  <rect width="512" height="512" rx="116" fill="url(#bg-grad)" />
  <!-- Apiapia Mascot Badge -->
  <image href="/icon-512x512.png" x="12" y="12" width="488" height="488" filter="url(#badge-glow)" />
</svg>
