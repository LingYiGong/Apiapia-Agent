<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="apiapia-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners (maskable safe zone respected) -->
  <rect width="512" height="512" rx="112" fill="url(#apiapia-bg)" />

  <!-- Apiapia the cat -->
  <g>
    <!-- Ears -->
    <polygon points="148,236 168,108 268,184" fill="#ffffff" />
    <polygon points="364,236 344,108 244,184" fill="#ffffff" />
    <polygon points="172,206 182,140 240,184" fill="#f9a8d4" />
    <polygon points="340,206 330,140 272,184" fill="#f9a8d4" />
    <!-- Head -->
    <circle cx="256" cy="302" r="128" fill="#ffffff" />
    <!-- Eyes -->
    <ellipse cx="206" cy="296" rx="22" ry="28" fill="#1e1b4b" />
    <ellipse cx="306" cy="296" rx="22" ry="28" fill="#1e1b4b" />
    <circle cx="213" cy="287" r="7" fill="#ffffff" />
    <circle cx="313" cy="287" r="7" fill="#ffffff" />
    <!-- Nose -->
    <path d="M244 336 L268 336 L256 350 Z" fill="#f472b6" stroke-linejoin="round" />
    <!-- Mouth (w shape) -->
    <path d="M256 350 C256 362, 240 366, 228 358 M256 350 C256 362, 272 366, 284 358" fill="none" stroke="#1e1b4b" stroke-width="9" stroke-linecap="round" />
    <!-- Whiskers -->
    <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85">
      <path d="M96 300 L150 310" />
      <path d="M98 336 L152 330" />
      <path d="M416 300 L362 310" />
      <path d="M414 336 L360 330" />
    </g>
  </g>
</svg>
