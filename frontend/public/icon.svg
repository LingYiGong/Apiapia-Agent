<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Outer glowing accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#glow)" stroke-width="6" />

  <!-- Robot Head / AI Symbol -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="translate(106, 116)">
    <!-- Antenna -->
    <path d="M150 20 L150 70" />
    <circle cx="150" cy="16" r="14" fill="#ffffff" stroke="none" />
    
    <!-- Main Head -->
    <rect x="30" y="70" width="240" height="190" rx="36" fill="#1e1b4b" fill-opacity="0.25" stroke="#ffffff" stroke-width="26" />
    
    <!-- Ears -->
    <path d="M10 145 L30 145" />
    <path d="M270 145 L290 145" />
    
    <!-- Eyes -->
    <circle cx="105" cy="150" r="22" fill="#67e8f9" stroke="none" />
    <circle cx="195" cy="150" r="22" fill="#67e8f9" stroke="none" />
    
    <!-- Mouth Line / Smile -->
    <path d="M105 205 C125 225, 175 225, 195 205" stroke="#ffffff" stroke-width="20" />
  </g>
</svg>
